# Publishes the npm package hproxy-mcp (folder npm/) with an npm provenance statement when a tag
# npm-v<version> is pushed. Written by HProxy's MCP engine like every file in this repository.
#
# npm trusted publishing: npm trusts this workflow of hproxy-com/hproxy-mcp by OpenID Connect, so no
# token is kept anywhere, and every version says where and from which commit it was built.

name: Publish to npm

on:
  push:
    tags:
      - 'npm-v*'

permissions: {}

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish hproxy-mcp
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check that the tag matches npm/package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "npm-v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match version $version in npm/package.json."
            exit 1
          fi

      - name: Check that npm can use trusted publishing
        run: |
          npm_version="$(npm --version)"
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$npm_version"; then
            echo "npm $npm_version is older than 11.5.1, the first release with trusted publishing."
            exit 1
          fi

      - name: Test against the live server
        run: node test.mjs

      - name: Publish
        run: npm publish --provenance --access public
